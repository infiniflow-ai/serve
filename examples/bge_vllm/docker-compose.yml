services:
  torchserve:
    container_name: torchserve
    image: infiniflow-ai/torchserve
    ports:
      - 8080:8080
      - 8081:8081
      - 8082:8082
    volumes:
      - ./model-store:/home/model-server/model-store
      - ./logs:/home/model-server/logs
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
